<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pietro Mischi – AI twin and portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pietro Mischi: MSc Banking & Finance at Stockholm University. Ask my AI twin, explore my projects and play two trading games." />
    <meta property="og:title" content="Pietro Mischi – AI twin and portfolio" />
    <meta property="og:description" content="Finance student in Stockholm who builds the models he studies." />
    <meta property="og:image" content="/pietro-avatar.jpg" />
    <link rel="icon" href="/pietro-avatar.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap">
        <a class="wordmark" href="#top">Pietro Mischi</a>
        <nav class="nav" aria-label="Sections">
          <a href="#twin" data-i18n="nav.chat">AI twin</a>
          <a href="#journey" data-i18n="nav.journey">Journey</a>
          <a href="#projects" data-i18n="nav.projects">Projects</a>
          <a href="#game" data-i18n="nav.game">Game</a>
          <a href="#life" data-i18n="nav.life">Off the desk</a>
          <a href="#contact" data-i18n="nav.contact">Contact</a>
        </nav>
        <button type="button" class="kbar-btn" id="kbarBtn" aria-haspopup="dialog"><span data-i18n="palette.open"></span><kbd id="kbarKey">Ctrl K</kbd></button>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="it">IT</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="sv">SV</button>
        </div>
      </div>
    </header>

    <div class="ticker" id="ticker">
      <p class="visually-hidden" data-i18n="ticker.label"></p>
      <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <main id="top">
      <!-- HERO -->
      <section class="hero">
        <div class="wrap">
          <div>
            <h1 class="hero-name"><span>Pietro</span><span>Mischi</span></h1>
            <p class="hero-lead" data-i18n="hero.lead"></p>
            <p class="hero-sub" data-i18n="hero.sub"></p>
            <div class="hero-cta">
              <a class="btn" href="#twin" data-i18n="hero.ctaChat"></a>
              <a class="btn ghost" href="#game" data-i18n="hero.ctaGame"></a>
            </div>
          </div>

          <div class="curve-panel">
            <div class="curve-head">
              <h2 data-i18n="hero.curveTitle"></h2>
              <div class="presets">
                <button type="button" data-preset="calm" data-i18n="hero.presetCalm"></button>
                <button type="button" data-preset="stress" data-i18n="hero.presetStress"></button>
                <button type="button" data-preset="hump" data-i18n="hero.presetHump"></button>
              </div>
            </div>
            <div class="curve-canvas-wrap">
              <canvas id="curve" aria-label="Nelson-Siegel implied volatility curve"></canvas>
              <div class="curve-tip" id="curveTip"></div>
            </div>
            <div class="sliders">
              <div class="slider"><label for="b0"><span data-i18n="hero.level"></span><output id="b0v"></output></label><input id="b0" type="range" min="10" max="35" step="0.5" value="21" /></div>
              <div class="slider"><label for="b1"><span data-i18n="hero.slope"></span><output id="b1v"></output></label><input id="b1" type="range" min="-15" max="25" step="0.5" value="-7" /></div>
              <div class="slider"><label for="b2"><span data-i18n="hero.curvature"></span><output id="b2v"></output></label><input id="b2" type="range" min="-15" max="15" step="0.5" value="2" /></div>
              <div class="slider"><label for="lam"><span data-i18n="hero.decay"></span><output id="lamv"></output></label><input id="lam" type="range" min="0.5" max="6" step="0.1" value="2.5" /></div>
            </div>
            <p class="curve-readout" id="curveReadout" aria-live="polite"></p>
            <div class="curve-foot">
              <p class="curve-note" data-i18n="hero.curveNote"></p>
              <button type="button" class="link-btn" data-ask-key="hero.askCurveQ" data-i18n="hero.askCurve"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- CHAT: stesso contratto di prima con /api/chat -->
      <section id="twin">
        <div class="wrap chat-grid">
          <div class="chat-side">
            <img src="/pietro-avatar.jpg" alt="Pietro Mischi" class="avatar" />
            <h2 data-i18n="chat.title"></h2>
            <p class="section-intro" data-i18n="chat.intro"></p>
          </div>
          <div>
            <div class="chat-box">
              <div class="chat-top">
                <span class="chat-status">Pietro (AI)</span>
                <button class="reset-btn" id="reset-btn" type="button" data-i18n="chat.reset"></button>
              </div>
              <div id="chat" class="chat" aria-live="polite"></div>
              <div id="suggestions" class="suggestions-row"></div>
              <div class="input-row">
                <div class="input-shell">
                  <label for="input" class="visually-hidden" data-i18n="chat.placeholder"></label>
                  <input id="input" autocomplete="off" />
                  <div class="hint" id="hint-label"></div>
                </div>
                <button id="send-btn" class="btn send-btn" type="button"></button>
              </div>
            </div>
            <p id="disclaimer" class="disclaimer"></p>
          </div>
        </div>
      </section>

      <!-- JOURNEY -->
      <section id="journey">
        <div class="wrap">
          <h2 data-i18n="journey.title"></h2>
          <p class="section-intro" data-i18n="journey.intro"></p>
          <div class="timeline" id="timeline" role="tablist"></div>
          <div class="tl-panel" id="tlPanel" role="tabpanel">
            <div><h3 id="tlTitle"></h3><p id="tlBody"></p></div>
            <div class="tl-nav">
              <button type="button" class="btn ghost small" id="tlPrev" aria-label="Previous">‹</button>
              <button type="button" class="btn ghost small" id="tlNext" aria-label="Next">›</button>
              <button type="button" class="btn small" id="tlAsk"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- PROJECTS -->
      <section id="projects">
        <div class="wrap">
          <h2 data-i18n="projects.title"></h2>
          <p class="section-intro" data-i18n="projects.intro"></p>
          <div class="filters" id="filters"></div>
          <ul class="proj-list" id="projList"></ul>
        </div>
      </section>

      <!-- ARCADE -->
      <section id="game">
        <div class="wrap">
          <h2 data-i18n="arcade.title"></h2>
          <p class="section-intro" data-i18n="arcade.intro"></p>

          <div class="arcade-tabs" role="tablist">
            <button type="button" role="tab" id="tabTape" aria-controls="panelTape" aria-selected="true">
              <strong data-i18n="arcade.tabTape"></strong><small data-i18n="arcade.tabTapeSub"></small>
            </button>
            <button type="button" role="tab" id="tabCarry" aria-controls="panelCarry" aria-selected="false" tabindex="-1">
              <strong data-i18n="arcade.tabCarry"></strong><small data-i18n="arcade.tabCarrySub"></small>
            </button>
          </div>

          <!-- Beat the Tape -->
          <div id="panelTape" role="tabpanel" aria-labelledby="tabTape">
            <p class="game-intro" data-i18n="tape.intro"></p>
            <div class="game tape" id="tapeBox">
              <div class="game-stats">
                <div class="stat"><small data-i18n="tape.time"></small><strong id="tTime">60.0</strong></div>
                <div class="stat"><small data-i18n="tape.pnl"></small><strong id="tPnl">0 kr</strong></div>
                <div class="stat"><small data-i18n="tape.pos"></small><strong id="tPos">–</strong></div>
                <div class="stat"><small data-i18n="tape.best"></small><strong id="tBest">–</strong></div>
                <div class="stat tape-quote"><small>NORDX</small><strong id="tPrice">100.00</strong></div>
              </div>
              <div class="newswire" id="tNews" aria-live="polite">
                <span class="wire-tag" id="tNewsTag"></span><span id="tNewsText"></span>
              </div>
              <div class="tape-chart-wrap">
                <canvas id="tapeChart" aria-label="Price chart"></canvas>
                <div class="tape-pop" id="tPop" aria-hidden="true"></div>
              </div>
              <div class="positions tape-actions" role="group">
                <button type="button" class="pos-btn buy" data-tape="1"><span data-i18n="tape.buy"></span><kbd>↑</kbd></button>
                <button type="button" class="pos-btn" data-tape="0"><span data-i18n="tape.close"></span><kbd>→</kbd></button>
                <button type="button" class="pos-btn sell" data-tape="-1"><span data-i18n="tape.sell"></span><kbd>↓</kbd></button>
              </div>
              <div class="game-controls">
                <button type="button" class="btn ghost small" id="tPause" disabled></button>
                <p class="game-rules" data-i18n="tape.keys"></p>
              </div>
              <div class="toast" id="tToast" role="status"></div>

              <div class="overlay" id="tStart">
                <div class="overlay-inner">
                  <h3>Beat the Tape</h3>
                  <p data-i18n="tape.rules"></p>
                  <p class="small-keys" data-i18n="tape.keys"></p>
                  <button type="button" class="btn" id="tStartBtn" data-i18n="tape.start"></button>
                </div>
              </div>
              <div class="overlay" id="tEnd" hidden>
                <div class="overlay-inner">
                  <p class="end-kicker" id="tEndKicker"></p>
                  <h3 id="tRank"></h3>
                  <div class="end-grid four">
                    <div><small data-i18n="tape.pnl"></small><strong id="teP"></strong></div>
                    <div><small data-i18n="tape.trades"></small><strong id="teT"></strong></div>
                    <div><small data-i18n="tape.hit"></small><strong id="teH"></strong></div>
                    <div><small data-i18n="tape.dd"></small><strong id="teD"></strong></div>
                  </div>
                  <p data-i18n="tape.lesson"></p>
                  <div class="actions">
                    <button type="button" class="btn" id="tAgain" data-i18n="tape.again"></button>
                    <button type="button" class="btn ghost" id="tShare" data-i18n="tape.share"></button>
                    <button type="button" class="btn ghost" data-ask-key="tape.askQ" data-i18n="tape.ask"></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Carry & Crash -->
          <div id="panelCarry" role="tabpanel" aria-labelledby="tabCarry" hidden>
            <p class="game-intro" data-i18n="game.intro"></p>
          <div class="game" id="gameBox">
            <div class="game-stats">
              <div class="stat"><small data-i18n="game.day"></small><strong id="gDay">0 / 120</strong></div>
              <div class="stat"><small><span class="swatch" aria-hidden="true"></span><span data-i18n="game.book"></span></small><strong id="gEq">100 000 kr</strong></div>
              <div class="stat"><small><span class="swatch bench" aria-hidden="true"></span><span data-i18n="game.bench"></span></small><strong id="gBench">100 000 kr</strong></div>
              <div class="stat"><small data-i18n="game.best"></small><strong id="gBest">–</strong></div>
            </div>
            <div class="game-main">
              <canvas id="gameChart" aria-label="Equity chart"></canvas>
              <div class="signal-box">
                <small data-i18n="game.signal"></small>
                <canvas id="sigCurve" aria-hidden="true"></canvas>
                <div class="sig-state" id="sigState"></div>
                <div class="sig-nums" id="sigNums"></div>
              </div>
            </div>
            <div class="positions" role="group">
              <button type="button" class="pos-btn" data-pos="short"><span data-i18n="game.short"></span><kbd>1</kbd></button>
              <button type="button" class="pos-btn" data-pos="cash" aria-pressed="true"><span data-i18n="game.cash"></span><kbd>2</kbd></button>
              <button type="button" class="pos-btn" data-pos="long"><span data-i18n="game.long"></span><kbd>3</kbd></button>
            </div>
            <div class="game-controls">
              <button type="button" class="btn ghost small" id="gPause" disabled></button>
              <p class="game-rules" data-i18n="game.rules"></p>
            </div>
            <div class="toast" id="gToast" role="status"></div>

            <div class="overlay" id="gStart">
              <div class="overlay-inner">
                <h3>Carry &amp; Crash</h3>
                <p data-i18n="game.rules"></p>
                <button type="button" class="btn" id="gStartBtn" data-i18n="game.start"></button>
              </div>
            </div>
            <div class="overlay" id="gEnd" hidden>
              <div class="overlay-inner">
                <h3 data-i18n="game.finalBook"></h3>
                <div class="end-grid">
                  <div><small data-i18n="game.finalBook"></small><strong id="eEq"></strong></div>
                  <div><small data-i18n="game.ret"></small><strong id="eRet"></strong></div>
                  <div><small data-i18n="game.dd"></small><strong id="eDd"></strong></div>
                </div>
                <p class="end-verdict" id="eVerdict"></p>
                <p data-i18n="game.lesson"></p>
                <div class="actions">
                  <button type="button" class="btn" id="gAgain" data-i18n="game.again"></button>
                  <button type="button" class="btn ghost" data-ask-key="game.askRealQ" data-i18n="game.askReal"></button>
                </div>
              </div>
            </div>
          </div>
          </div>
        </div>
      </section>

      <!-- OFF THE DESK -->
      <section id="life">
        <div class="wrap">
          <h2 data-i18n="life.title"></h2>
          <div class="life-grid" id="lifeGrid"></div>
        </div>
      </section>

      <!-- CONTACT -->
      <section id="contact">
        <div class="wrap">
          <h2 data-i18n="contact.title"></h2>
          <p class="section-intro" data-i18n="contact.body"></p>
          <a class="contact-email" href="mailto:pietro.mischi@yahoo.it">pietro.mischi@yahoo.it</a>
          <div class="contact-actions">
            <button type="button" class="btn" id="copyEmail" data-i18n="contact.copy"></button>
            <a class="btn ghost" href="https://www.linkedin.com/in/pietro-mischi" target="_blank" rel="noopener">LinkedIn</a>
            <a class="btn ghost" href="https://github.com/pi-mis" target="_blank" rel="noopener">GitHub</a>
            <span class="copied" id="copied" data-i18n="contact.copied" role="status"></span>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap" data-i18n="footer"></div>
    </footer>

    <button type="button" class="fab" id="fab" hidden><span class="fab-dot" aria-hidden="true"></span><span data-i18n="palette.fab"></span></button>

    <div class="kbar" id="kbar" hidden>
      <div class="kbar-backdrop" data-close></div>
      <div class="kbar-box" role="dialog" aria-modal="true" aria-labelledby="kbarInput">
        <input id="kbarInput" type="text" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="kbarList" />
        <ul id="kbarList" role="listbox"></ul>
        <p class="kbar-hint" data-i18n="palette.hint"></p>
      </div>
    </div>

    <script src="/i18n.js"></script>
    <script src="/i18n-extra.js"></script>
    <script src="/curve.js"></script>
    <script src="/app.js"></script>
    <script src="/game.js"></script>
    <script src="/tape.js"></script>
    <script src="/extras.js"></script>
  </body>
</html>
